[package]
name = "mintshot"
version = "1.2.0"
edition = "2021"
authors = ["MintShot Team"]
description = "Lightweight partial screenshot tool for Linux Mint"
license = "MIT"

[dependencies]
x11 = { version = "2.21", features = ["xlib", "xfixes", "xrender", "xcursor"] }
png = "0.17"
arboard = "3.3"
chrono = "0.4"
dirs = "5.0"
signal-hook = "0.3"
log = "0.4"
env_logger = "0.10"
nix = { version = "0.27", features = ["signal", "poll"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
