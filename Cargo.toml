[package]
name = "mintshot"
version = "2.4.2"
edition = "2021"
rust-version = "1.87"
authors = ["MintShot Team"]
description = "Lightweight partial screenshot tool for Arch Linux and Hyprland"
license = "MIT"

[dependencies]
# Capture and clipboard use grim, slurp and wl-copy; no X11/GUI bindings.
png = "0.17"
chrono = "0.4"
log = "0.4"
env_logger = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
