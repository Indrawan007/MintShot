[package]
name = "mintshot"
version = "1.3.0"
edition = "2021"
authors = ["MintShot Team"]
description = "Lightweight partial screenshot tool for Linux Mint"
license = "MIT"

[dependencies]
# Only the features actually used are enabled — each one makes the crate's
# build.rs pkg-config-probe the matching library, so enabling an unused one
# adds a build dependency for code that is never called.
#   xlib     — core X11
#   xinerama — full virtual-desktop bounding box (multi-monitor). Note this
#              links libXinerama, so it is a runtime dependency too.
x11 = { version = "2.21", features = ["xlib", "xinerama"] }
png = "0.17"
arboard = "3.3"
chrono = "0.4"
dirs = "5.0"
signal-hook = "0.3"
log = "0.4"
env_logger = "0.10"
nix = { version = "0.27", features = ["signal", "poll"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
